# Local development database only. Production uses a Vercel Marketplace Postgres.
services:
  postgres:
    image: postgres:16-alpine
    container_name: avero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avero
      POSTGRES_PASSWORD: avero
      POSTGRES_DB: avero
    ports:
      - '5432:5432'
    volumes:
      - avero-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avero -d avero']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  avero-postgres:
