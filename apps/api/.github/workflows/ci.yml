name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:

jobs:
  check:
    name: type-check · lint · test · contract · image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e -- --detectOpenHandles
      - run: pnpm test:integration
      - run: pnpm openapi:check
      - run: docker build --target runtime .
